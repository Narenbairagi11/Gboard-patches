name: Phase 1 Custom Font - Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - phase1-custom-font
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Morphe Packages credentials
        shell: bash
        env:
          MORPHE_PACKAGES_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: |
          if [ -z "$MORPHE_PACKAGES_TOKEN" ]; then
            echo "::error::MORPHE_PACKAGES_TOKEN repository secret is missing or empty."
            echo "Add the repository secret before running this workflow."
            exit 1
          fi
          echo "MORPHE_PACKAGES_TOKEN is configured."

      - name: Verify Morphe registry access
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: |
          URL="https://maven.pkg.github.com/MorpheApp/registry/app/morphe/patches/app.morphe.patches.gradle.plugin/1.3.3/app.morphe.patches.gradle.plugin-1.3.3.pom"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$URL")
          echo "Morphe registry HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Morphe registry authentication/package access failed (HTTP $STATUS)."
            exit 1
          fi

      - name: Build Android patches
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: ./gradlew :patches:buildAndroid

      - name: Run tests
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: ./gradlew :patches:test
